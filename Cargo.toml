[package]
name = "original-agent"
version = "0.3.9"
edition = "2021"
description = "Rust terminal coding agent with multi-provider support, project verification, and local session history"
license = "MIT"
readme = "README.md"

[[bin]]
name = "original"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
claudius = { path = "vendor/claudius", default-features = false, features = ["native-tls"] }
crossterm = "0.28"
dirs = "6"
dotenvy = "0.15"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rustyline = { version = "15", features = ["custom-bindings", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vt100 = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
