name: Rust CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
      - run: cargo build --locked --release
  installer:
    # Do not use shell: ${{ matrix.shell }} — GitHub evaluates `shell` before the
    # matrix context exists and fails with: Unrecognized named-value: 'matrix'.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline installer fixture tests (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-installer.ps1
      - name: Offline installer fixture tests (Unix)
        if: runner.os != 'Windows'
        run: sh scripts/test-installer.sh
